<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="장인우의 Dev Notes — 자주 쓰는 도구의 사용법, 업데이트, 문제 해결 기록.">
  <title>Dev Notes — 장인우 · inwoo.log</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="icon" type="image/svg+xml" href="media/icon/favicon.svg">
  <link rel="stylesheet" href="css/ds.css">
</head>
<body>

  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="site-header site-header--dark">
    <div class="site-header__inner">
      <a class="wordmark" href="index.html" aria-label="inwoo.log 홈">inwoo<span>.log</span></a>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="주요 메뉴">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="how.html">How I Work</a></li>
          <li><a href="notes.html" aria-current="page">Dev Notes</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page">

    <header class="page-head">
      <p class="eyebrow">Dev Notes</p>
      <h1 class="display">도구 사용법과 해결 기록</h1>
      <p class="lead">자주 쓰는 도구의 사용법, 업데이트, 문제 해결을 정리합니다.</p>
    </header>

    <section class="notes" data-notes aria-labelledby="notes-title">
      <h2 class="visually-hidden" id="notes-title">노트 목록</h2>

      <div data-notes-list>
        <div class="toolbar">
          <div class="toolbar__row">
            <label class="toolbar__label" for="note-search">검색</label>
            <div class="search"><input id="note-search" type="search" placeholder="제목·요약·태그로 찾기" autocomplete="off" aria-describedby="note-search-hint"></div>
            <span class="visually-hidden" id="note-search-hint">입력하면 아래 목록이 바로 걸러집니다.</span>
          </div>
          <div class="toolbar__row" role="group" aria-labelledby="note-cat-label">
            <span class="toolbar__label" id="note-cat-label">분류</span>
            <ul class="chips" data-note-cats></ul>
          </div>
        </div>

        <p class="count" data-notes-count aria-live="polite">노트를 불러오는 중…</p>
        <ol class="entries" data-notes-grid></ol>
      </div>

      <article class="reader-view" data-note-reader aria-labelledby="note-title" hidden></article>
    </section>

  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>inwoo.log — 장인우의 기획·개발 기록 · © 2026</p>
      <ul>
        <li><a href="mailto:roseprincess0331@gmail.com">이메일</a></li>
        <li><a href="https://github.com/inwoo-jang" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://inwoo-jang.github.io/SKALA-FRONT/" target="_blank" rel="noopener">Inwoo.log 원본</a></li>
      </ul>
    </div>
  </footer>

  <script src="script/nav.js"></script>
  <script src="script/markdown.js"></script>
  <script src="script/notes.js"></script>
</body>
</html>
