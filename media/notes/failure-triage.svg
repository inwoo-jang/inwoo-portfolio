<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" role="img" aria-labelledby="t d">
  <title id="t">틀린 답변의 원인을 좁히는 순서</title>
  <desc id="d">최종 답변 오류를 감지하면 올바른 근거가 검색됐는지 확인한다. 아니면 검색·데이터를, 맞으면 생성·컨텍스트를 조사한다. 이후 같은 조건에서 재현되는지 확인하고, 수정·회귀 테스트·운영 모니터링으로 이어진다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#111418" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="640" height="484" fill="#fff"/>
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" text-anchor="middle">
    <g fill="none" stroke="#111418" stroke-width="1.3" marker-end="url(#a)">
      <line x1="320" y1="72" x2="320" y2="98"/>
      <path d="M320 156 V180 H160 V206"/>
      <path d="M320 180 H480 V206"/>
      <path d="M160 270 V294 H320 V316"/>
      <line x1="320" y1="374" x2="320" y2="402"/>
    </g>
    <path d="M480 270 V294 H320" fill="none" stroke="#111418" stroke-width="1.3"/>

    <g fill="#fff" stroke="#111418" stroke-width="1.3">
      <rect x="190" y="20" width="260" height="52"/>
      <rect x="20" y="208" width="280" height="62"/>
      <rect x="340" y="208" width="280" height="62"/>
      <rect x="140" y="404" width="360" height="56" stroke-width="2"/>
    </g>
    <g fill="#F5F6F8" stroke="#111418" stroke-width="1.3" stroke-dasharray="5 3">
      <rect x="170" y="100" width="300" height="56"/>
      <rect x="170" y="318" width="300" height="56"/>
    </g>

    <g font-size="15" font-weight="600" fill="#111418">
      <text x="320" y="42">최종 답변 오류 감지</text>
      <text x="320" y="123">올바른 근거가 검색됐는가?</text>
      <text x="160" y="233">검색 · 데이터 조사</text>
      <text x="480" y="233">생성 · 컨텍스트 조사</text>
      <text x="320" y="341">같은 조건에서 재현되는가?</text>
      <text x="320" y="427">수정 → 회귀 테스트 → 운영 모니터링</text>
    </g>
    <g font-size="12.5" fill="#545B66">
      <text x="320" y="61">사용자 신고 또는 자동 평가</text>
      <text x="320" y="143">검색 문서와 정답 근거 비교</text>
      <text x="160" y="255">인덱스, 검색어, 문서 누락, 최신성 확인</text>
      <text x="480" y="255">프롬프트, 문서 충돌, 모델 해석 확인</text>
      <text x="320" y="361">버전 고정 · 반복 실행 · 조건별 비교</text>
      <text x="320" y="447">수정 이후 다른 문제가 생기지 않는지도 확인</text>
    </g>
    <g font-size="12.5" font-weight="600" fill="#111418">
      <text x="230" y="174">아니요</text>
      <text x="400" y="174">예</text>
    </g>
  </g>
</svg>
